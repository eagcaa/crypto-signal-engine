[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "crypto-signal-engine"
version = "0.1.0"
description = "Real-time crypto market signal research and calibration engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiohttp>=3.10,<4",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0.35,<3",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=13,<16",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/crypto_signal_engine"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
